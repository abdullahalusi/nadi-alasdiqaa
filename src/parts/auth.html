<!-- AUTH -->
<section class="screen" id="scr-auth">
  <div class="wrap">
    <div class="authbox">
      <div class="logo">نادي الأصدقاء</div>
      <div class="sub">صالة ألعاب أونلاين تلعبها مع أصحابك</div>
      <h2 id="authTitle">ادخل باسمك</h2>
      <form id="authForm">
        <div class="field">
          <label for="inName">اسم اللاعب</label>
          <input id="inName" maxlength="14" placeholder="مثال: أبو علي" autocomplete="off" required>
        </div>
        <div class="field">
          <label>اختر صورتك</label>
          <div class="avgrid" id="avgrid"></div>
        </div>
        <div style="margin-top:22px"><button class="btn gold" style="width:100%" type="submit" id="authBtn">ابدأ اللعب ✨</button></div>
        <div style="margin-top:10px;display:none" id="authCancelWrap"><button class="btn ghost" style="width:100%" type="button" id="authCancel">رجوع</button></div>
      </form>
      <div class="note" id="authNote">لا يُحفظ أي شيء — اسمك ورقاقاتك مؤقتة وتنتهي بإغلاق الصفحة. المضيف هو من يحدد نقود كل لاعب.</div>
    </div>
  </div>
</section>
